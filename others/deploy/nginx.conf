# Example: replace server_name, paths and the upstream port for your deployment.
# Build frontend/dist first. Run Django with a production WSGI/ASGI server.
server {
    listen 80;
    server_name solar.example.com;
    root /srv/sunpower/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /srv/sunpower/backend/media/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
