{% extends "base.html" %}
{% block body %}
<header class="ptop"><div class="in">
  <a class="brand" href="/portal/"><span class="logo"></span><span>SunPower<small>Customer portal</small></span></a>
  <div class="row">
    {% include "components/switcher.html" %}
    {% include "components/bell.html" %}
    <form method="post" action="/logout/">{% csrf_token %}<button class="btn btn-sm" style="background:rgba(255,255,255,.14);color:#fff">Log out</button></form>
  </div>
</div></header>
<main class="portal" style="padding-top:1.2rem">{% block content %}{% endblock %}</main>
<nav class="bottom-nav">{% for label, url, active in portal_nav %}<a href="{{ url }}" class="{% if active %}active{% endif %}">{{ label }}</a>{% endfor %}</nav>
{% endblock %}
