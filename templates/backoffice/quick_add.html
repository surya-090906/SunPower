{% extends "backoffice/base.html" %}
{% block title %}Log an enquiry{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Log a call or WhatsApp enquiry</h1><div class="sub">For customers who phone or message instead of using the web form. They can activate a portal login later.</div></div></div>
<form method="post" class="card" style="max-width:820px"><div class="card-b">{% csrf_token %}
  <div class="fields">
    <div class="field"><label>Channel</label><select class="inp" name="source"><option value="call">Phone call</option><option value="whatsapp">WhatsApp</option></select></div>
    <div class="field"><label>Property</label><select class="inp" name="segment"><option value="home">Home</option><option value="factory">Small factory</option></select></div>
    <div class="field"><label>Full name</label><input class="inp" name="name" value="{{ form.name }}" required></div>
    <div class="field"><label>Mobile number</label><input class="inp" name="phone" value="{{ form.phone }}" inputmode="numeric" required></div>
    <div class="field full"><label>Installation address</label><textarea class="inp" name="address" rows="2" required>{{ form.address }}</textarea></div>
    <div class="field"><label>City</label><input class="inp" name="city" value="{{ form.city|default:'Bengaluru' }}"></div>
    <div class="field"><label>Pincode</label><input class="inp" name="pincode" value="{{ form.pincode }}" inputmode="numeric" maxlength="6" required></div>
    <div class="field"><label>System</label><select class="inp" name="package"><option value="ongrid">On-Grid</option><option value="offgrid">Off-Grid</option><option value="panelset">Panel set only</option><option value="unsure">Not sure</option></select></div>
    <div class="field"><label>Capacity</label><select class="inp" name="kw">{% for k in "12345" %}<option value="{{ k }}" {% if k == "3" %}selected{% endif %}>{{ k }} kW</option>{% endfor %}</select></div>
    <div class="field"><label>Monthly bill (₹)</label><input class="inp" name="bill" inputmode="numeric"></div>
    <div class="field"><label>Roof area (sq ft)</label><input class="inp" name="area" inputmode="numeric"></div>
    <label class="check full"><input type="checkbox" name="subsidy" value="1"><span>Customer wants the government subsidy</span></label>
    <div class="field full"><label>Notes</label><textarea class="inp" name="notes" rows="2">{{ form.notes }}</textarea></div>
  </div>
  <button class="btn btn-primary mt">Log enquiry</button>
</div></form>
{% endblock %}
