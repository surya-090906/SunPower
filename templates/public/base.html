{% extends "base.html" %}
{% block body %}
<header class="ptop"><div class="in">
  <a class="brand" href="/"><span class="logo"></span><span>SunPower<small>Solar, start to warranty</small></span></a>
  <div class="row">
    {% if user.is_authenticated %}<a class="btn btn-sm btn-primary" href="/">My account</a>{% else %}<a class="btn btn-sm" style="background:rgba(255,255,255,.14);color:#fff" href="/login/">Log in</a>{% endif %}
  </div>
</div></header>
<main class="public {% block wide %}{% endblock %}">{% block content %}{% endblock %}</main>
{% endblock %}
